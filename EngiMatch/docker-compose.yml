services:
  postgres:
    image: postgres:16-alpine
    container_name: engimatch-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: engimatch
    ports:
      - "34873:5432"
    volumes:
      - postgres_engimatch:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d engimatch"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_engimatch:
    name: engimatch-postgres-data
